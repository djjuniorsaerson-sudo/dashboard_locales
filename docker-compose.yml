version: '3.8'

services:
  central-db:
    image: postgres:15-alpine
    container_name: central-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CENTRAL_DB_USER}
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD}
      POSTGRES_DB: ${CENTRAL_DB_NAME}
    volumes:
      - central_data:/var/lib/postgresql/data

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: central-api:v5
    container_name: central-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${CENTRAL_DB_USER}:${CENTRAL_DB_PASSWORD}@central-db:5432/${CENTRAL_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_ORGANIZATION_NAME=${ADMIN_ORGANIZATION_NAME:-Empresa Demo}
      - YUMMY_DB_URL=${YUMMY_DB_URL:-}
    depends_on:
      - central-db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: central-web:v5
    container_name: central-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  central_data:
