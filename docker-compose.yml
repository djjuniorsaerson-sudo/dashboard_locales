version: '3.8'

services:
  central-db:
    image: postgres:15-alpine
    container_name: central-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CENTRAL_DB_USER:-central_admin}
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:-central_password_123}
      POSTGRES_DB: ${CENTRAL_DB_NAME:-central_db}
    volumes:
      - central_data:/var/lib/postgresql/data

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: central-api:v5
    container_name: central-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${CENTRAL_DB_USER:-central_admin}:${CENTRAL_DB_PASSWORD:-central_password_123}@central-db:5432/${CENTRAL_DB_NAME:-central_db}
      - SECRET_KEY=${SECRET_KEY:-panel_secret_temporal_2026_cambiar_despues}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@empresa.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminTemporal2026!}
      - ADMIN_ORGANIZATION_NAME=${ADMIN_ORGANIZATION_NAME:-Empresa Demo}
      - YUMMY_DB_URL=${YUMMY_DB_URL:-}
    depends_on:
      - central-db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: central-web:v5
    container_name: central-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  central_data:
